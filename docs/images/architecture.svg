  <text x="480" y="162" class="name">LiveKit</text>
  <text x="480" y="193" class="detail" text-anchor="middle">Local server</text>

  <rect x="720" y="120" width="192" height="100" rx="8" class="box"/>
  <text x="816" y="162" class="name">AI agent</text>
  <text x="816" y="193" class="detail" text-anchor="middle">Node.js</text>

  <text x="312" y="138" class="detail" text-anchor="middle">Audio</text>
  <path d="M252 152H372" class="line duplex"/>
  <text x="312" y="188" class="detail" text-anchor="middle">Code + text</text>
  <path d="M252 202H372" class="line duplex"/>
  <text x="648" y="138" class="detail" text-anchor="middle">Audio</text>
  <path d="M588 152H708" class="line duplex"/>
  <text x="648" y="188" class="detail" text-anchor="middle">Code + text</text>
  <path d="M588 202H708" class="line duplex"/>

  <text x="48" y="269" class="detail">You add: highlight while speaking · edit · run</text>

  <path d="M816 232V316H622" class="line duplex"/>
  <text x="690" y="294" class="detail">API calls</text>
  <rect x="350" y="284" width="260" height="68" rx="8" class="box"/>
  <text x="480" y="313" class="section" text-anchor="middle">SViam API access</text>
  <text x="480" y="339" class="detail" text-anchor="middle">US$10 each · five days</text>
  <path d="M480 352V370" class="line"/>
  <text x="48" y="345" class="section">Online voice APIs</text>
  <text x="912" y="345" class="detail" text-anchor="end">One personal key</text>
