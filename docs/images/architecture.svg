<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">How the starter works</title>
  <desc id="desc">This GitHub take-home is separate from the Maya interview. The browser editor, local LiveKit server, and Node.js agent run on your laptop. The starter agent reads code. You add highlighting aligned with speech, direct code editing, and execution, keeping each action tied to the correct code version. A personal portal key connects the agent to SViam's metered gateway for Deepgram, OpenAI, and ElevenLabs. The pack provides ten dollars per provider, thirty dollars total, for five days. No deployment is required.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 2 8 5 2 8" fill="none" stroke="#737373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #242424; }
      .title { font-size: 28px; font-weight: 700; }
      .name { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 18px; fill: #5c5c5c; }
      .section { font-size: 18px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #bdbdbd; stroke-width: 1; }
      .line { fill: none; stroke: #737373; stroke-width: 1.5; stroke-linejoin: round; }
      .duplex { marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
